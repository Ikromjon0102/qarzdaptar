<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-secondary-bg-color, #f2f3f7);
            color: var(--tg-theme-text-color, #111);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            flex-direction: column;
            text-align: center;
        }
        .loader {
            border: 4px solid rgba(128, 128, 128, 0.2);
            border-top-color: var(--tg-theme-button-color, #2f7ff0);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #statusText { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
        #hint { color: var(--tg-theme-hint-color, #8a8f98); font-size: 14px; max-width: 320px; margin: 0 0 20px; }
        .btn {
            display: none;
            padding: 12px 20px;
            border-radius: 12px;
            background: var(--tg-theme-button-color, #2f7ff0);
            color: var(--tg-theme-button-text-color, #fff);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    {% csrf_token %}
    <div class="loader" id="loader"></div>
    <p id="statusText">Tizimga kirilmoqda...</p>
    <p id="hint"></p>
    <a class="btn" id="actionBtn" href="https://t.me/{{ bot_username }}">Botni ochish</a>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        function showError(title, hint, withButton) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('statusText').innerText = title;
            document.getElementById('hint').innerText = hint || '';
            if (withButton) document.getElementById('actionBtn').style.display = 'inline-block';
        }

        if (tg && tg.initData) {
            tg.expand();
            // initData Telegram tomonidan imzolangan - server uni tekshiradi
            fetch("{% url 'telegram_auth' %}", {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
                body: JSON.stringify({init_data: tg.initData})
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        window.location.href = data.redirect_url;
                    } else {
                        showError("Kirib bo'lmadi", data.msg || "Qayta urinib ko'ring.", false);
                    }
                })
                .catch(() => showError("Aloqa xatosi", "Internetni tekshirib, qayta oching.", false));
        } else {
            showError("Telegram orqali oching",
                "Bu sahifa faqat Telegram'dagi bot ichida ishlaydi. Botga o'ting va «Kirish» tugmasini bosing.", true);
        }
    </script>
</body>

</html>
