{% extends 'base.html' %}

{% block matn %}
<h5 class="fw-bold m-0">{% if client %}<i class="fa-solid fa-user-pen"></i> Tahrirlash{% else %}<i class="fa-solid fa-user-plus"></i> Yangi mijoz{% endif %}</h5>
{% endblock %}

{% block content %}
<form method="POST" autocomplete="off">
    {% csrf_token %}

    <div class="app-card bg-white mb-4 shadow-sm">
        <div class="mb-3 text-dark">
            <label class="form-label text-muted small text-uppercase fw-bold text-dark">F.I.SH</label>
            <input type="text" name="full_name" class="form-control fw-bold text-dark" placeholder="Mijoz ismi"
                   value="{% if form %}{{ form.full_name }}{% else %}{{ client.full_name|default:'' }}{% endif %}" required>
        </div>

        <div class="mb-0">
            <label class="form-label text-muted small text-uppercase fw-bold text-dark">Telefon</label>
            <input type="tel" name="phone" class="form-control fw-bold" placeholder="+998 90 123 45 67"
                   value="{% if form %}{{ form.phone }}{% else %}{{ client.phone|default:'' }}{% endif %}" required>
        </div>
    </div>

    {% if not client %}
    <p class="small text-center mb-3" style="color: var(--tg-hint);">
        <i class="fa-brands fa-telegram"></i> Saqlangandan keyin mijoz sahifasidan uni botga taklif qilishingiz mumkin.
    </p>
    {% endif %}

    <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold">
        <i class="fa-solid fa-floppy-disk"></i> SAQLASH
    </button>
</form>
{% endblock %}
