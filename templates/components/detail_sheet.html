{% comment %}
Pastdan chiquvchi tafsilot oynasi (bottom sheet).
JS: openDetailSheet({date, sum, sumClass, status, items, actions: {resend, confirm, delete, open}})
actions ichidagi URL berilmasa, tugma ko'rinmaydi.
{% endcomment %}
<div class="modal fade" id="detailSheet" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog sheet">
        <div class="modal-content">
            <div class="modal-body p-4">
                <div class="sheet-handle"></div>
                <div class="text-center mb-3">
                    <div class="small text-muted" id="sheetDate"></div>
                    <div class="fw-bold" style="font-size: 26px;" id="sheetSum"></div>
                    <div class="small" id="sheetStatus"></div>
                </div>
                <div class="p-3 rounded-3 mb-3" style="background: var(--tg-bg); white-space: pre-wrap; font-size: 14px;" id="sheetItems"></div>
                <div class="d-grid gap-2">
                    <a href="#" class="btn btn-primary d-none" id="sheetOpen"><i class="fa-solid fa-check"></i> Ko'rish va tasdiqlash</a>
                    <a href="#" class="btn btn-outline-primary d-none" id="sheetResend"><i class="fa-regular fa-paper-plane"></i> Qayta yuborish</a>
                    <a href="#" class="btn btn-success d-none" id="sheetConfirm"
                       onclick="return confirm('Mijoz tasdiqlamasdan balansga yozilsinmi?')"><i class="fa-solid fa-check"></i> Tasdiqlash</a>
                    <a href="#" class="btn btn-outline-danger d-none" id="sheetDelete"
                       onclick="return confirm('Bu yozuvni o\'chirasizmi? Balans o\'zgaradi va buni qaytarib bo\'lmaydi.')"><i class="fa-solid fa-trash-can"></i> O'chirish</a>
                    <button type="button" class="btn" style="background: var(--tg-bg); color: var(--tg-text);" data-bs-dismiss="modal">Yopish</button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .modal-dialog.sheet {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        margin: 0 auto;
        max-width: 560px;
        width: 100%;
        transform: translateY(100%);
        transition: transform 0.25s ease-out;
    }
    .modal.show .modal-dialog.sheet { transform: none; }
    .sheet .modal-content { border-radius: 20px 20px 0 0; border: none; padding-bottom: env(safe-area-inset-bottom); }
    .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: -8px auto 16px; }
</style>

<script>
    function openDetailSheet(opts) {
        const el = id => document.getElementById(id);
        el('sheetDate').innerText = opts.date || '';
        el('sheetSum').innerText = opts.sum || '';
        el('sheetSum').className = 'fw-bold ' + (opts.sumClass || '');
        el('sheetStatus').innerText = opts.status || '';
        el('sheetItems').innerText = opts.items || '';
        const actions = opts.actions || {};
        [['sheetOpen', 'open'], ['sheetResend', 'resend'], ['sheetConfirm', 'confirm'], ['sheetDelete', 'delete']].forEach(([id, key]) => {
            el(id).classList.toggle('d-none', !actions[key]);
            if (actions[key]) el(id).href = actions[key];
        });
        bootstrap.Modal.getOrCreateInstance(el('detailSheet')).show();
    }
</script>
